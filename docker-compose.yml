networks:
  # Public ingress network for frontend Nginx
  pokevinted-public:
    driver: bridge
  # Isolated internal network for backend and datastores
  pokevinted-internal:
    driver: bridge

services:
  # --- PERSISTENCE: MONGODB ---
  mongodb:
    image: mongo:7.0
    container_name: pokevinted-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin_pokevinted}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-ChangeMe_P0k3V1nt3d_M0ng0_P@ssw0rd!}
      - MONGO_INITDB_DATABASE=${MONGO_DB:-pokevinted}
    ports:
      # Bound strictly to host loopback (127.0.0.1) for local CLI inspection
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - pokevinted-internal
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_ROOT_USER:-admin_pokevinted}", "-p", "${MONGO_ROOT_PASSWORD:-ChangeMe_P0k3V1nt3d_M0ng0_P@ssw0rd!}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- SEARCH & ANALYTICS: ELASTICSEARCH ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: pokevinted-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      # Bound strictly to host loopback (127.0.0.1); internal services reach it via
      # the Docker network. Never exposed on 0.0.0.0.
      - "127.0.0.1:9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - pokevinted-internal
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # --- CACHE & REAL-TIME COUNTERS: REDIS ---
  redis:
    image: redis:7-alpine
    container_name: pokevinted-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-ChangeMe_P0k3V1nt3d_R3d1s_T0k3n!}"]
    ports:
      # Bound strictly to host loopback (127.0.0.1) with mandatory password
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pokevinted-internal
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ChangeMe_P0k3V1nt3d_R3d1s_T0k3n!}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # --- APPLICATION: FASTAPI BACKEND ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pokevinted-backend
    restart: unless-stopped
    ports:
      # Bound to loopback for Swagger / OpenAPI docs
      - "127.0.0.1:8000:8000"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://admin_pokevinted:ChangeMe_P0k3V1nt3d_M0ng0_P%40ssw0rd!@mongodb:27017/pokevinted?authSource=admin}
      - MONGO_DB=${MONGO_DB:-pokevinted}
      - MONGO_ROOT_USER=${MONGO_ROOT_USER:-admin_pokevinted}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-ChangeMe_P0k3V1nt3d_M0ng0_P@ssw0rd!}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-http://elasticsearch:9200}
      - REDIS_URL=${REDIS_URL:-redis://:ChangeMe_P0k3V1nt3d_R3d1s_T0k3n!@redis:6379/0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-ChangeMe_P0k3V1nt3d_R3d1s_T0k3n!}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    networks:
      - pokevinted-internal
      - pokevinted-public
    mem_limit: 512m
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --- PRESENTATION: REACT / NGINX FRONTEND ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pokevinted-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:80"
    networks:
      - pokevinted-public
      - pokevinted-internal
    mem_limit: 128m
    depends_on:
      backend:
        condition: service_healthy

  # --- OBSERVABILITY: GRAFANA ---
  grafana:
    image: grafana/grafana:latest
    container_name: pokevinted-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-ChangeMe_Grafana_Admin_Password!}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - pokevinted-internal
      - pokevinted-public
    mem_limit: 256m

volumes:
  mongo_data:
  elastic_data:
  redis_data:
  grafana_data:
