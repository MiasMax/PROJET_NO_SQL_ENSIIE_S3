version: '3.8'

networks:
  # Réseau public : uniquement frontend et reverse proxy
  pokevinted-public:
    driver: bridge
  # Réseau interne : isolé d'Internet pour les communications backend <-> bases NoSQL
  pokevinted-internal:
    driver: bridge

services:
  # --- COUCHE STOCKAGE & NOSQL (Isolées sur pokevinted-internal, ports bindés sur 127.0.0.1) ---
  mongodb:
    image: mongo:7.0
    container_name: pokevinted-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB:-pokevinted}
    ports:
      # SÉCURITÉ : Bind strict sur 127.0.0.1 (Loopback hôte) pour l'évaluation
      # Empêche tout scan automatisé externe d'accéder à la base
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - pokevinted-internal
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_ROOT_USER}", "-p", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: pokevinted-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      # SÉCURITÉ : Accessible uniquement en local (127.0.0.1) sur l'hôte
      - "127.0.0.1:9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - pokevinted-internal
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: pokevinted-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      # SÉCURITÉ : Bind strict sur 127.0.0.1 avec mot de passe obligatoire
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pokevinted-internal
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # --- COUCHE BACKEND (FastAPI - Clean DDD) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pokevinted-backend
    restart: unless-stopped
    ports:
      # Bind local sur l'hôte pour Swagger / OpenAPI (/docs) sans exposition internet directe
      - "127.0.0.1:8000:8000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB=${MONGO_DB:-pokevinted}
      - MONGO_ROOT_USER=${MONGO_ROOT_USER}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-http://elasticsearch:9200}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    networks:
      - pokevinted-internal
      - pokevinted-public
    mem_limit: 512m
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --- COUCHE FRONTEND (React + Vite + Reverse Proxy Nginx) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pokevinted-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    networks:
      - pokevinted-public
      - pokevinted-internal
    mem_limit: 128m
    depends_on:
      backend:
        condition: service_healthy

  # --- SUPERVISION & DASHBOARD (Grafana) ---
  grafana:
    image: grafana/grafana:latest
    container_name: pokevinted-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - pokevinted-internal
      - pokevinted-public
    mem_limit: 256m

volumes:
  mongo_data:
  elastic_data:
  redis_data:
  grafana_data:
