[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pokevinted-backend"
version = "1.0.0"
description = "Marketplace PokéVinted — Backend FastAPI Clean Architecture DDD & Multi-NoSQL"
authors = [{ name = "ENSIIE S3 NoSQL Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "motor>=3.3.2",
    "pymongo>=4.6.2",
    "elasticsearch[async]>=8.12.0",
    "redis>=5.0.3",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
]

# --- CONFIGURATION PYTEST ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient.*",
    "ignore::DeprecationWarning:anyio.abc.*",
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:Warning",
]

# --- CONFIGURATION RUFF (Linter & Formatter haute performance) ---
[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [
    ".git",
    ".pytest_cache",
    ".mypy_cache",
    "__pycache__",
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   # Erreurs pycodestyle
    "W",   # Avertissements pycodestyle
    "F",   # Pyflakes
    "I",   # Tri des imports (isort)
    "UP",  # Pyupgrade (modernisation syntaxe Python 3.11+)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # Ligne trop longue (gérée par le formateur)
    "B008", # Appel de fonction dans les valeurs par défaut (nécessaire pour FastAPI Depends)
    "UP007", # Union types | optionnel selon compatibilité
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --- CONFIGURATION MYPY (Vérification Statique des Types) ---
[tool.mypy]
python_version = "3.11"
mypy_path = "."
explicit_package_bases = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "motor.*",
    "pymongo.*",
    "elasticsearch.*",
    "redis.*",
    "app.infrastructure.persistence.*",
]
ignore_errors = true
ignore_missing_imports = true
