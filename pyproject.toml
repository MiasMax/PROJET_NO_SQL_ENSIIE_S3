[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient.*",
    "ignore::DeprecationWarning:anyio.abc.*",
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:Warning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [
    ".git",
    ".pytest_cache",
    ".mypy_cache",
    "__pycache__",
    "venv",
    ".venv",
    "node_modules",
    "frontend",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort import order
    "UP",  # pyupgrade modern Python syntax
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # Line length handled by formatter
    "B008", # Function call in default argument (required for FastAPI Depends)
    "UP007", # Type union syntax preference
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
explicit_package_bases = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "motor.*",
    "pymongo.*",
    "elasticsearch.*",
    "redis.*",
    "app.infrastructure.persistence.*",
]
ignore_errors = true
ignore_missing_imports = true
